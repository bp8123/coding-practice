<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>clickergame</title>
    <script src="clickergame.js" defer></script>
    <link rel="stylesheet" href="clickergame.css">
</head>
<body>
    <div id = "div">
        <div id = "square"></div>
        <p id = "counter">Blocks mined: 0</p>
        <p id = "bps">Blocks per second: 0</p>
    </div>
    <div id = "shop">
        <h1>Upgrades</h1>
        <button id = "wooden-pickaxe">Wooden Pickaxe<br>Cost: 100<br>Power: 2</button>
        <button id = "stone-pickaxe">Stone Pickaxe<br>Cost: 200<br>Power: 3</button>
        <button id = "iron-pickaxe">Iron Pickaxe<br>Cost: 400<br>Power: 5</button>
        <button id = "diamond-pickaxe">Diamond Pickaxe<br>Cost: 800<br>Power: 8</button>
        <p id = "errormsg-upgrades"></p>
        <p id = "successmsg-upgrades"></p>
    </div>
    <div id = "automatic">
        <h1>Shop</h1>
        <button id = "villager">Villager<br>Cost: 500<br>Blocks per sec: 1</button>
        <button id = "iron-golem">Iron Golem<br>Cost: 1000<br>Blocks per sec: 10</button>
        <button id = "ender-dragon">Ender Dragon<br>Cost: 2000<br>Blocks per sec: 20</button>
        <p id = "errormsg-shop"></p>
        <p id = "successmsg-shop"></p>
    </div>

</body>
</html>
