<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>mini survival game</title>
    <link rel="stylesheet" href="script.css">
    <script src = "script.js" defer></script>
</head>
<body>
  <div id = "stats">
    <h3 id = "title-stats">Statistics</h3>
    <p id = "health"></p>
    <p id = "hunger"></p>
    <p id = "day-number"></p>
  </div>
  <div id = "inventory">
    <h3 id = "inventory-title">Inventory</h3>
    <p id = "inventory-items"></p>
  </div>
  <div id = "buttons">
    <button type = "button" id = "minebtn">Mine</button>
    <button type = "button" id = "chopbtn">Chop Wood</button>
    <button type = "button" id = "eatbtn">Eat</button>
    <button type = "button" id = "fightbtn">Fight</button>
    <button type = "button" id = "craftbtn">Craft</button>
    <button type = "button" id = "sleepbtn">Sleep</button>
  </div>
  <div id = "logs">
    <h3 id = "logs-title">Logs</h3>
    <p id = "log"></p>
  </div>
</body>
</html>
