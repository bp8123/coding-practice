<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>tic-tac-to</title>
    <script src="tic-tac-toe.js" defer></script>
    <link rel="stylesheet" href="tic-tac-toe.css">
</head>
<body>
    <h1 id="message"></h1>
    <div class = "container">
        <div class="left_top">
            <p id = "left_top_p"></p>
        </div>
        <div class="middle_top">
            <p id = "middle_top_p"></p>
        </div>
        <div class="right_top">
            <p id = "right_top_p"></p>
        </div>
        <div class="left_middle">
            <p id = "left_middle_p"></p>
        </div>
        <div class="middle">
            <p id = "middle_p"></p>
        </div>
        <div class="right_middle">
            <p id = "right_middle_p"></p>
        </div>
        <div class="left_bottom">
            <p id = "left_bottom_p"></p>
        </div>
        <div class="middle_bottom">
            <p id = "middle_bottom_p"></p>
        </div>
        <div class="right_bottom">
            <p id = "right_bottom_p"></p>
        </div>
    </div>
</body>
</html>
